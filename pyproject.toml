[project]
name = "speechjenerator"
version = "0.1.0"
description = "It does TTS."
authors = [{ name = "Warren Davies"}]
readme = "README.md"
homepage = "https://github.com/WarrenDavies/speechjenerator"
repository = "https://github.com/WarrenDavies/speechjenerator"
packages = [
    { include = "speechjenerator", from = "src" }
]
requires-python = ">=3.10,<3.15"

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry.dependencies]
python = ">=3.10,<3.15"
basejenerator = {path = "../base-jenerator", develop = true}
gtts = "^2.5.4"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
